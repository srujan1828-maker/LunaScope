name: Verify science and cloud image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install scientific dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Fetch official NASA inputs and prepare raster
        run: |
          python backend/scripts/fetch_nasa_data.py
          python backend/scripts/prepare_nasa_data.py
      - name: Scientific and API tests
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: python -m pytest backend/tests -q
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build production image
        run: docker build -t lunascope:ci .
      - name: Smoke-test container with prepared NASA volume
        run: |
          docker run -d --name lunascope-ci -p 127.0.0.1:8080:8000 -e LUNASCOPE_AUTO_FETCH=false -v "$GITHUB_WORKSPACE/data/nasa:/app/data/nasa:ro" lunascope:ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/ready; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8080/api/ready
          curl --fail http://127.0.0.1:8080/ > /dev/null
          curl --fail -H 'Content-Type: application/json' -d '{"lat_deg":-89,"lon_deg":0,"time_iso":"2027-01-01T00:00:00Z"}' http://127.0.0.1:8080/api/surface/frame > /dev/null
      - name: Container logs
        if: always()
        run: docker logs lunascope-ci || true
